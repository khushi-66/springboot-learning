<!DOCTYPE html>
<html>
<head>
<title>Student	Form </title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
	<body>
		<div  class="container">
		<div class="row   mt-5">
		<div class="col-2"></div>
		<div class="col-8">
	<form    action="save_student"  method="post"   th:object="${student}">
	<div  class="mb-3">
	<label    for="name"class="form-label">Student Name</label>
	<input type="text"   th:field="*{name}" class="form-control" id="name"  placeholder="Enter Your Name">
	</div>
	<div  class="mb-3">
	<label    for="cllg"class="form-label">Student college</label>
	<input type="text"    th:field="*{college}"class="form-control" id="cllg"  placeholder="Enter Your college">
	</div>
	<div  class="mb-3">
	<label    for="degree"class="form-label">Student Degree</label>
	<input type="text"   th:field="*{degree}" class="form-control" id="degree"  placeholder="Enter Your college">
	</div>
	<div  class="mb-3">
	<label    for="marks"class="form-label">Student marks</label>
	<input type="text"  th:field="*{marks}" class="form-control" id="marks"  placeholder="Enter Your marks">
	</div>
	<div  class="mb-3">
	<label    for="fees"class="form-label">Student Fees</label>
	<input  th:field="*{fees}" type="number" class="form-control" id="fees"  placeholder="Enter Your fees">
	</div>
	<input type="submit"  value="Register"  class="btn btn-primary">
			</form>
		</div>
		<div class="col-2"></div>
		</div>
		</div>
		
	</body>
</html>
